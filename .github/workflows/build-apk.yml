name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'augustus_mario_game/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: augustus_mario_game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK for clean direct download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Augustus-Game.apk

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Augustus-APK
          path: augustus_mario_game/build/app/outputs/flutter-apk/Augustus-Game.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Augustus IWBTG (Latest APK)"
          body: |
            🎮 **ดาวน์โหลดไฟล์ APK ได้โดยตรง (ไม่ต้องแตกไฟล์ ZIP)**
            
            - คลิกดาวน์โหลดไฟล์ `Augustus-Game.apk` ด้านล่างไปติดตั้งบนมือถือ Android ได้ทันที
            - อัปเดตล่าสุดจากการ Build อัตโนมัติบน GitHub Actions
          make_latest: true
          files: augustus_mario_game/build/app/outputs/flutter-apk/Augustus-Game.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
